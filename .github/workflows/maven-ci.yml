name: Automated Code Review and CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  code-review-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run Checkstyle and generate XML report
        run: ./mvnw checkstyle:checkstyle

      - name: Inline Checkstyle Review on PR
        if: always() && github.event_name == 'pull_request'
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_report_xml: 'target/checkstyle-result.xml'
          fail_on_error: true

      - name: Build, Test and Enforce JaCoCo Coverage
        run: ./mvnw verify -Dcheckstyle.skip=true
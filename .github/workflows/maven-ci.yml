- name: Run Checkstyle and generate XML report
    run: ./mvnw checkstyle:checkstyle

    - name: Inline Checkstyle Review on PR
      if: always() && github.event_name == 'pull_request'
      uses: dbelyaev/action-checkstyle@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        checkstyle_report_xml: 'target/checkstyle-result.xml'
        level: error

    - name: Fail if Checkstyle violations exist
      run: |
        if grep -q "<error " target/checkstyle-result.xml; then
          echo "Checkstyle violations detected!"
          exit 1
        fi